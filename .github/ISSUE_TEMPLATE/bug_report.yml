name: Bug report
description: Something in the dashboard is broken or behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
  - type: textarea
    id: logs
    attributes:
      label: Console or network errors
      description: Paste failing requests and console output. Remove cookies and secrets first.
      render: text
